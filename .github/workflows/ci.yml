name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Vérification syntaxique
        run: |
          node --check config.js
          node --check calculs.js
          node --check app.js
          node --check sw.js

      - name: Tests unitaires + smoke test
        run: node --test
